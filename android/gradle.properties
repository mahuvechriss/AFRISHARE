org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true

# Increase Gradle download timeouts for slower connections
org.gradle.internal.http.connection-timeout-millis=600000
org.gradle.internal.http.socket-timeout-millis=600000
systemProp.gradle.wrapper.download.connectionTimeout=600000
systemProp.gradle.wrapper.download.socketTimeout=600000
